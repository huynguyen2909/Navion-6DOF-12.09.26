# Historical SI Landing Gear values from the uploaded standalone T-6C module.
# Reference only: Stage 5 does not parse this YAML. The explicit T-6C
# reference factories retain the same values for regression tests.

mass_kg: 2267.965273

# JSBSim negated-Ixz convention:
# matrix = [[ixx,0,-ixz],[0,iyy,0],[-ixz,0,izz]]
inertia_kg_m2:
  ixx: 5716.535216
  iyy: 10315.062951
  izz: 14039.494855
  ixz: -1355.817948

solver_max_iterations: 50
solver_convergence_tolerance: 1.0e-5
rolling_friction_factor: 1.0
static_friction_factor: 1.0
maximum_strut_force_n: 0.0
ground_down_position_ned_m: 0.0

gears:
