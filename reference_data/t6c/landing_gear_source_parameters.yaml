    static_friction_coefficient: 0.5
    rolling_friction_coefficient: 0.02
    maximum_steering_angle_rad: 0.1221730476
    steering_mode: steered
    brake_group: none
    pacejka_stiffness_b: 0.06
    pacejka_shape_c: 2.8
